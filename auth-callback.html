<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signing in - CRM Template</title>
  <link rel="icon" href="/favicon.ico" type="image/svg+xml" sizes="any">
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/login.css?v=9">
</head>
<body>
  <div class="login-shell">
    <div class="container">
      <div class="login-card-header">
        <div id="logo_login" aria-hidden="true">CRM</div>
        <div class="brand-kicker">CRM Template</div>
        <h1>Signing you in&hellip;</h1>
      </div>
      <div class="login-card-body">
        <p class="login-card-sub">Finishing Google sign-in. This only takes a second.</p>
        <div id="callbackFeedback" class="feedback"></div>
      </div>
    </div>
  </div>

  <script src="/vendor/supabase.js"></script>
  <script>
    (async function () {
      var feedback = document.getElementById('callbackFeedback');
      function showError(message) {
        if (!feedback) return;
        feedback.textContent = message;
        feedback.className = 'feedback show error';
      }

      var config = window.__AUTH_CONFIG__ || {};
      if (!config.supabaseUrl || !config.supabaseAnonKey || !window.supabase) {
        showError('Sign-in is not configured correctly.');
        return;
      }

      // getSession() already waits for the Google redirect to be fully
      // processed internally, but on a slow device/network (or a browser
      // extension delaying storage access) that can still take a moment
      // longer than a single check accounts for. Retry a few times before
      // concluding there's really no session, rather than bouncing back to
      // the login page (which is what previously made sign-in look like it
      // needed two attempts).
      async function waitForSession(authClient) {
        for (var attempt = 0; attempt < 5; attempt++) {
          var result = await authClient.auth.getSession();
          var session = result.data && result.data.session;
          if (session) return session;
          if (attempt < 4) await new Promise(function (r) { setTimeout(r, 400); });
        }
        return null;
      }

      try {
        var authClient = window.supabase.createClient(config.supabaseUrl, config.supabaseAnonKey);
        var session = await waitForSession(authClient);

        if (!session) {
          window.location.href = '/?error=no_session';
          return;
        }

        var res = await fetch('/api/v2/auth/google-session', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ access_token: session.access_token })
        });
        var data = await res.json();

        if (!res.ok || !data.success) {
          throw new Error((data && data.error) || 'Sign-in failed');
        }

        window.location.href = '/main';
      } catch (err) {
        console.error('Auth callback error:', err);
        window.location.href = '/?error=' + encodeURIComponent(err.message || 'auth_failed');
      }
    })();
  </script>
</body>
</html>
