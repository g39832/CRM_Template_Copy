services:
  - type: web
    name: crm-template
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      # NOTE: do not hardcode PORT here. Render injects PORT itself (default
      # 10000) and routes its HTTPS edge proxy to that port; the app binds to
      # 0.0.0.0:$PORT. Overriding it locally-set values only invites mismatches
      # between the port Render probes and the port the app listens on.
      - key: SESSION_SECRET
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: crm-files
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: ENABLE_DB_BACKUPS
        value: false
      - key: CRON_SECRET
        sync: false
      - key: DISABLE_AUTH
        value: false
      - key: NODE_ENV
        value: production
