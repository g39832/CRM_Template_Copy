services:
  - type: web
    name: crm-template
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      # NOTE: do not hardcode PORT here. Render injects PORT itself (default
      # 10000) and routes its HTTPS edge proxy to that port; the app binds to
      # 0.0.0.0:$PORT. Overriding it locally-set values only invites mismatches
      # between the port Render probes and the port the app listens on.
      - key: SESSION_SECRET
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Optional but recommended: the Supabase Postgres "Session pooler"
      # connection string (port 5432, NOT the transaction pooler on 6543).
      # With it, sessions live in Postgres so logins survive restarts and idle
      # spin-downs. Left unset, the app falls back to in-memory sessions.
      - key: SUPABASE_DATABASE_URL
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: crm-files
      # Public bucket for the logo only (customer files stay in the private one).
      - key: SUPABASE_PUBLIC_BUCKET
        value: crm-public-assets
      # First admin's Google email — sign-in is invitation-only.
      - key: ADMIN_EMAILS
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: true
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: ENABLE_DB_BACKUPS
        value: false
      - key: CRON_SECRET
        sync: false
      - key: DISABLE_AUTH
        value: false
      - key: NODE_ENV
        value: production
